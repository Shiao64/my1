name: OTI China weekly update

on:
  schedule:
    - cron: "0 2 * * 1"   # Mondays 02:00 UTC = Monday 10:00 Beijing
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oti-china-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Fetch, decrypt and rebuild asia/events.json (read-only on OTI)
        env:
          OTI_KEY: ${{ secrets.OTI_KEY }}
        run: bash tools/oti_weekly_update.sh
      - name: Commit if changed
        run: |
          cat asia/events-changes.json | head -c 2000; echo
          if git diff --quiet -- asia/events.json asia/events-changes.json && [ -z "$(git ls-files --others --exclude-standard asia/events-changes.json)" ]; then
            echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add asia/events.json asia/events-changes.json
          git commit -m "OTI China weekly update $(date -u +%F)"
          git push
