name: Poster guard
# 2026-11-15: PRs only. On main, "R2 sync" fills missing posters itself before uploading.
on:
  pull_request:
    paths: ['asia/events*.json']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/ensure_posters.py --check
