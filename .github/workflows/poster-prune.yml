name: Daily past-poster cleanup

# 2026-11-17 (Shiao): every day, drop expired past posters from the cards.
# Rule lives in tools/prune_past_posters.py: at most 4 per card, none dated more
# than 30 days ago, undated ones stay. Then tools/fix_past_posters.py: a past
# poster that cannot be shown is fixed (thumbs) or dropped. Dropped posters are
# not kept (Shiao 2026-11-18).
# If anything changed it commits to main and starts "R2 sync" (a push made with
# GITHUB_TOKEN does not trigger other workflows by itself).
# Also: tools/dj_sessions.py daily (DJ session log, DJ page candidates for Shiao).
# Manual run: Actions -> "Daily past-poster cleanup" -> Run workflow.

on:
  schedule:
    - cron: '17 19 * * *'   # 03:17 Beijing time
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: poster-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prune, commit, start R2 sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -q pillow
          TODAY=$(TZ=Asia/Shanghai date +%F)
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          # The event JSON files are one line each, so a rebase over another data
          # change always conflicts. On a failed push, start again from the new main.
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main && git clean -fdq images/thumb images/thumb800
            # 2026-11-21 (Shiao): log DJ nights before old posters are pruned (data/dj-sessions.json keeps them)
            python3 tools/dj_sessions.py daily
            python3 tools/prune_past_posters.py --apply --today=$TODAY
            # 2026-11-18: past posters that cannot be shown: make missing thumbs, drop missing files / text posters
            python3 tools/fix_past_posters.py --apply
            git checkout -- tools/__pycache__/ 2>/dev/null || true
            git clean -fdq tools/__pycache__/ 2>/dev/null || true
            git add asia/events.json asia/events-core.json asia/events-more.json asia/asia-map.js images/thumb images/thumb800 data/dj-sessions.json data/dj-candidates.md asia/dj-recent.json
            if git diff --cached --quiet; then echo "nothing expired today"; exit 0; fi
            git commit -qm "Daily cleanup: drop expired past posters"
            if git push origin HEAD:main; then
              gh workflow run r2-sync.yml --ref main
              gh workflow run inbox-refresh.yml --ref main || true
              exit 0
            fi
            sleep $((i * 15))
          done
          echo "::error::Could not push after 5 tries."; exit 1
