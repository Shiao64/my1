<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报名将于2026年12月1日开放 · 北京精选探戈周末</title>
<meta name="description" content="第4届北京精选探戈周末（2027年6月18–22日，北京奥加美术馆酒店）报名将于2026年12月1日开放。">
<link rel="canonical" href="https://tangoweekend.org/event/beijing-2027-tango-weekend/zh/register/">
<link rel="alternate" hreflang="en" href="https://tangoweekend.org/event/beijing-2027-tango-weekend/register/">
<link rel="alternate" hreflang="zh-CN" href="https://tangoweekend.org/event/beijing-2027-tango-weekend/zh/register/">
<link rel="alternate" hreflang="x-default" href="https://tangoweekend.org/event/beijing-2027-tango-weekend/register/">
<link rel="stylesheet" href="../../../../css/style.css?v=zhh2">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png"><link rel="alternate icon" href="/favicon.ico"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="../../../../css/atm-detail.css?v=d6">
</head>
<body>
<div class="atm-bar atm-sticky" data-back="../"><a class="atm-map" href="/zh/asia/"><span class="atm-ico" aria-hidden="true"></span>亚洲探戈地图</a><a class="atm-lang" href="../../register/" hreflang="en">EN</a></div>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="../">北京精选探戈周末</a>
    <button class="nav-toggle" aria-label="菜单" aria-expanded="false">☰</button>
    <div class="header-menus">
    <nav class="lang-switch" aria-label="语言与地区">
      <a href="../../register/" hreflang="en" lang="en">EN</a>
      <a href="./" hreflang="zh-CN" lang="zh-CN" aria-current="page">中文</a>
      <a href="../../../../zh/asia/">Asia Tango Map</a>
    </nav>
    </div>
  </div>
</header>
<section class="hero" style="min-height:calc(100vh - 64px);display:flex;align-items:center">
  <div class="wrap" style="display:block;text-align:center;max-width:760px">
    <span class="edition">第4届 · 2027.6.18–22</span>
    <h1>报名将于2026年12月1日开放</h1>
    <p class="meta">第4届北京精选探戈周末 · 北京奥加美术馆酒店（A.C. Art Museum Hotel）</p>
    <div class="countdown" data-countdown style="justify-content:center">
      <div><b data-d>--</b><span>天</span></div>
      <div><b data-h>--</b><span>时</span></div>
      <div><b data-m>--</b><span>分</span></div>
    </div>
    <p class="meta" style="margin-top:28px">报名开放前，欢迎加入社群获取最新消息：</p>
    <div class="btns" style="justify-content:center">
      <a class="btn btn-gold" href="https://www.facebook.com/groups/selecttangoweekend" target="_blank" rel="noopener">Facebook: selecttangoweekend</a>
      <a class="btn btn-ghost" href="mailto:info@tangoweekend.org">info@tangoweekend.org</a>
    </div>
    <p class="meta">微信群：「2027 Select Tango Weekend」，发邮件给我们即可受邀入群</p>
  </div>
</section>
<script>
(function(){var t=new Date('2026-12-01T00:00:00+08:00').getTime();function k(){var d=t-Date.now();document.querySelectorAll('[data-countdown]').forEach(function(e){if(d<=0){e.innerHTML='<div><b>✓</b><span>报名已开放</span></div>';return;}e.querySelector('[data-d]').textContent=Math.floor(d/864e5);e.querySelector('[data-h]').textContent=String(Math.floor(d%864e5/36e5)).padStart(2,'0');e.querySelector('[data-m]').textContent=String(Math.floor(d%36e5/6e4)).padStart(2,'0');});}k();setInterval(k,30000);})();

(function(){var btn=document.querySelector('.nav-toggle'),header=document.querySelector('.site-header');if(!btn||!header)return;btn.addEventListener('click',function(){var o=header.classList.toggle('is-open');btn.setAttribute('aria-expanded',o);});header.querySelectorAll('.header-menus a').forEach(function(a){a.addEventListener('click',function(){header.classList.remove('is-open');btn.setAttribute('aria-expanded','false');});});})();
</script>
<script src="../../../../asia/atm-detail.js?v=d3"></script>
</body>
</html>
