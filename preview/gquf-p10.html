<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ATM P10 预览</title>
<style>
:root{--cream:#FBF5E9;--teal:#0E6E78;--deep:#0A4F57;--heart:#C8102E;--muted:#5f6f66;--milonga:#9E1020;--gold:#C9A227}
*{box-sizing:border-box}body{margin:0;background:#e8e2d6;display:flex;justify-content:center;padding:16px;font-family:system-ui,sans-serif}
.phone{width:390px;height:844px;background:var(--cream);border-radius:28px;border:8px solid #111;overflow:hidden;position:relative}
.status{height:28px;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-size:12px}
.bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #e4e0d8;background:var(--cream);position:sticky;top:0;z-index:2}
.back{border:0;background:none;color:var(--teal);font-size:32px;cursor:pointer}
.title{color:var(--deep);font-weight:700;font-size:18px}
.heart{width:24px;height:24px}
.heart svg{display:block}
.meta{margin:10px 10px 0;padding:10px 12px;background:#eceeea;border-radius:10px}
.row1{display:flex;align-items:center;gap:8px;color:var(--deep);font-weight:700;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--milonga)}
.row2{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:14px}
.venue,.more{color:var(--teal);font-weight:700;border:0;background:none;cursor:pointer;font-size:14px}
.dj{color:var(--muted);font-weight:600;flex:1}
.stage{margin:14px 18px 0;height:620px;display:flex;align-items:center;justify-content:center;position:relative}
.frame{border:2px solid var(--gold);background:#fff;padding:0;max-width:100%;max-height:100%;display:flex;align-items:center;justify-content:center}
.frame img{width:auto;height:auto;max-width:320px;max-height:600px;object-fit:contain;display:block}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:28px;height:18px;border:0;border-radius:999px;background:rgba(33,55,60,.92);color:#fff;cursor:pointer}
.nav.l{left:0}.nav.r{right:0}
.pager{text-align:center;margin-top:8px;font:700 13px system-ui;color:var(--teal)}
</style></head><body>
<div class="phone">
  <div class="status"><span>00:26</span><span>●●●</span></div>
  <div class="bar">
    <button class="back" type="button" onclick="history.length>1?history.back():location.href='https://tangoweekend.org/zh/asia/'">‹</button>
    <span class="title">探戈会</span>
    <span class="heart" aria-label="未收藏" title="未收藏">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.2 5 6.6 5c2.1 0 3.5 1.1 5.4 3.1C13.9 6.1 15.3 5 17.4 5 20.8 5 23 8.3 21.5 11.8 19.5 16.4 12 21 12 21z" fill="none" stroke="#C8102E" stroke-width="1.8" stroke-linejoin="round"/></svg>
    </span>
  </div>
  <div class="meta">
    <div class="row1"><span class="dot"></span><span>每周二舞会 11/3 · 20:00–24:00</span></div>
    <div class="row2"><span class="venue">Ala House</span><span class="dj">DJ: Yelyn Woo</span><button class="more" type="button">更多 ›</button></div>
  </div>
  <div class="stage">
    <button class="nav l" id="prev" type="button">◀</button>
    <div class="frame"><img id="poster" alt="海报" src="https://tangoweekend.org/images/asia/posters/GqufXmMX.jpg"/></div>
    <button class="nav r" id="next" type="button">▶</button>
  </div>
  <div class="pager" id="pager">1 / 3</div>
</div>
<script>
const posters=[
 'https://tangoweekend.org/images/asia/posters/GqufXmMX.jpg',
 'https://tangoweekend.org/images/asia/posters/R015.jpg',
 'https://tangoweekend.org/images/asia/posters/R017.jpg'
];
let i=0; const img=document.getElementById('poster'), pager=document.getElementById('pager');
function show(n){i=(n+posters.length)%posters.length; img.src=posters[i]; pager.textContent=(i+1)+' / '+posters.length}
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('next').onclick=()=>show(i+1);
show(0);
</script>
</body></html>
