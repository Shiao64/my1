<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390, initial-scale=1">
<meta name="robots" content="noindex">
<title>探戈会 · 预览（未上线）</title>
<style>
  :root{--cream:#FBF5E9;--teal:#0E6E78;--title:#0A4F57;--heart:#C8102E;--muted:#5f6f66;--dot:#2A1A14;--gold:#C9A227}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;background:var(--cream);height:100%}
  body{width:100%;max-width:390px;margin:0 auto;color:#2a1a14;font:16px/1.4 "PingFang SC","Noto Sans SC",system-ui,sans-serif}
  #scroll{height:100dvh;overflow:auto;background:var(--cream)}
  .cream-gap{height:36px;background:var(--cream)}
  .bar{position:sticky;top:0;z-index:20;height:48px;background:#FBF5E9;border-bottom:1px solid #e4e0d8}
  .bar-in{position:relative;height:48px;padding:0 4px;display:flex;align-items:center;justify-content:space-between}
  .iconbtn{position:relative;z-index:1;width:40px;height:40px;padding:0;border:0;background:transparent;color:#0E6E78;cursor:pointer;display:grid;place-items:center}
  .iconbtn:focus-visible{outline:2px solid #0E6E78;outline-offset:1px;border-radius:8px}
  .bar h1{position:absolute;left:44px;right:44px;top:0;height:48px;margin:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font:700 22px/1 "Noto Serif SC","Songti SC",serif;color:#0A4F57;white-space:nowrap}
  .heart svg{width:26px;height:26px;display:block}
  .heart path{fill:none;stroke:#C8102E;stroke-width:2.2;stroke-linejoin:round}
  .heart[aria-pressed="true"] path{fill:#C8102E;stroke:#C8102E}
  main{padding:8px 8px 12px}
  .info{width:100%;margin:0 0 12px;padding:10px 14px;background:#E8E6EC;border-radius:12px;position:relative;z-index:2}
  .row1{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:0 .35em;color:#0A4F57;font-weight:800;font-size:17px;line-height:1.35}
  .row1 .lead{display:inline-flex;align-items:center;white-space:nowrap}
  .dot{width:10px;height:10px;margin-right:6px;border-radius:50%;background:#2A1A14;flex:none}
  .venue{color:#0E6E78;font-weight:800;white-space:nowrap}
  .row2{margin:6px 0 0;display:flex;align-items:baseline;justify-content:space-between;gap:20px}
  .dj{color:#5f6f66;font-weight:800;font-size:17px;white-space:nowrap}
  .more,.less{border:0;background:transparent;color:#0E6E78;font:800 17px/1.2 inherit;cursor:pointer;padding:0}
  .more::after{content:" ›"}
  .less{display:block;width:100%;margin-top:12px;padding:10px 0;text-align:left;background:#FBF5E9;border-radius:12px}
  .less::after{content:"▴";float:right}
  .rows{display:grid;gap:8px;padding:12px 2px 0;font-size:16px;color:#2a1a14}
  .row{display:grid;grid-template-columns:72px 1fr;gap:8px}
  .row b{color:#5f6f66;font-size:14px;font-weight:700}
  .row span{overflow-wrap:anywhere}
  .rows a{color:#0E6E78;font-weight:700}
  .stage{display:flex;align-items:flex-start;gap:8px;margin-top:12px}
  .frame{position:relative;flex:1;min-width:0}
  .frame img{display:block;width:100%;height:auto;max-height:calc(100dvh - 250px);object-fit:contain;object-position:center top;box-sizing:border-box;border:2px solid #C9A227;border-radius:8px;background:#fff;cursor:zoom-in}
  .chev{flex:none;align-self:center;width:42px;height:72px;padding:0;border:0;border-radius:50%;background:rgba(10,20,24,.45);display:grid;place-items:center;cursor:pointer}
  .chev svg{width:22px;height:36px;display:block}
  .chev.is-off{opacity:.35}
  .idx{position:absolute;top:8px;right:8px;z-index:2;color:#fff;background:rgba(0,0,0,.45);font:700 13px/1 system-ui,sans-serif;padding:5px 8px;border-radius:999px}
  .pv{position:fixed;inset:0;z-index:50;background:rgba(6,20,24,.92);overflow:auto}
  .pv[hidden]{display:none}
  .pv img{display:block;max-width:100%;height:auto;margin:0 auto}
  .pv-x{position:fixed;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:28px}
</style>
</head>
<body>
<div id="scroll">
  <div class="cream-gap" aria-hidden="true"></div>
  <header class="bar">
    <div class="bar-in">
      <button type="button" class="iconbtn" id="back" aria-label="返回">
        <svg width="16" height="28" viewBox="0 0 14 28" aria-hidden="true"><path d="M11.5 2.5L2.8 14l8.7 11.5" fill="none" stroke="#0A4F57" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1>探戈会</h1>
      <button type="button" class="iconbtn heart" id="heart" aria-pressed="false" aria-label="加入收藏">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.2 5 6.6 5c2.1 0 3.5 1.1 5.4 3.1C13.9 6.1 15.3 5 17.4 5 20.8 5 23 8.3 21.5 11.8 19.5 16.4 12 21 12 21z"/></svg>
      </button>
    </div>
  </header>
  <main>
    <section class="info" id="info">
      <p class="row1">
        <span class="lead"><i class="dot" aria-hidden="true"></i><span id="freq">每周二舞会</span> <time id="when">11/3</time></span>
        <span>·</span>
        <span class="time">20:00–24:00</span>
        <span class="venue">Ala House</span>
      </p>
      <p class="row2">
        <span class="dj">DJ: Yelyn Woo</span>
        <button type="button" class="more" id="more" aria-expanded="false" aria-controls="moreBody">更多</button>
      </p>
      <div id="moreBody" hidden>
        <div class="rows">
          <div class="row"><b>主办</b><span>刘峥</span></div>
          <div class="row"><b>场地</b><span>Ala House上海长滩店·外滩旗舰店（北京市东直门外大街亮马河南路18号2层）</span></div>
          <div class="row"><b>DJ:</b><span>Yelyn Woo（首尔）· Frank Jin 联合嘉宾 Seoul Guest Night Selector 特别场驻场</span></div>
          <div class="row"><b>地址</b><span><a href="https://uri.amap.com/search?keyword=%E5%8C%97%E4%BA%AC%E5%B8%82%E4%B8%9C%E7%9B%B4%E9%97%A8%E5%A4%96%E5%A4%A7%E8%A1%97%E4%BA%AE%E9%A9%AC%E6%B2%B3%E5%8D%97%E8%B7%AF18%E5%8F%B72%E5%B1%82" target="_blank" rel="noopener">北京市东直门外大街亮马河南路18号2层</a></span></div>
          <div class="row"><b>联络方式</b><span>微信号：beijingtango (刘峥)</span></div>
          <div class="row"><b>链接</b><span><a href="https://www.facebook.com/tangobeijing" target="_blank" rel="noopener">脸书</a></span></div>
        </div>
        <button type="button" class="less" id="less">收起</button>
      </div>
    </section>
    <div class="stage">
      <button type="button" class="chev prev" id="prev" aria-label="较新的海报">
        <svg viewBox="0 0 28 44" aria-hidden="true"><path fill="#fff" d="M20 2 L6 22 L20 42 L15 42 L1 22 L15 2 Z"/></svg>
      </button>
      <div class="frame" id="frame">
        <img id="poster" width="466" height="1014" alt="探戈会 本期海报" src="https://tangoweekend.org/images/asia/posters/GqufXmMX.jpg">
        <span class="idx" id="idx">1 / 3</span>
      </div>
      <button type="button" class="chev next" id="next" aria-label="更早的海报">
        <svg viewBox="0 0 28 44" aria-hidden="true"><path fill="#fff" d="M8 2 L22 22 L8 42 L13 42 L27 22 L13 2 Z"/></svg>
      </button>
    </div>
  </main>
</div>
<div class="pv" id="pv" hidden>
  <img id="pvImg" alt="">
  <button type="button" class="pv-x" id="pvX" aria-label="关闭">✕</button>
</div>
<script>
(function(){
  var slides = [
    {src:'https://tangoweekend.org/images/asia/posters/GqufXmMX.jpg', alt:'探戈会 本期海报'},
    {src:'https://tangoweekend.org/images/asia/posters/R015.jpg', alt:'R015 海报'},
    {src:'https://tangoweekend.org/images/asia/posters/R001.jpg', alt:'R001 海报'}
  ];
  var index = 0;
  var poster = document.getElementById('poster');
  var prev = document.getElementById('prev');
  var next = document.getElementById('next');
  var idx = document.getElementById('idx');
  var more = document.getElementById('more');
  var moreBody = document.getElementById('moreBody');
  var less = document.getElementById('less');
  var heart = document.getElementById('heart');
  var pv = document.getElementById('pv');
  var pvImg = document.getElementById('pvImg');
  function show(i){
    if (i < 0 || i >= slides.length) return;
    index = i;
    poster.src = slides[i].src;
    poster.alt = slides[i].alt;
    idx.textContent = (index + 1) + ' / ' + slides.length;
    var one = slides.length < 2;
    prev.hidden = one;
    next.hidden = one;
    prev.classList.toggle('is-off', index === 0);
    next.classList.toggle('is-off', index === slides.length - 1);
  }
  function go(d){ show(index + d); }
  show(0);
  prev.addEventListener('click', function(){ go(-1); });
  next.addEventListener('click', function(){ go(1); });
  var drag = null;
  document.getElementById('frame').addEventListener('pointerdown', function(e){
    if (e.target.closest && e.target.closest('button')) return;
    drag = {x:e.clientX, y:e.clientY};
  });
  document.getElementById('frame').addEventListener('pointerup', function(e){
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag = null;
    if (Math.abs(dx) > 36 && Math.abs(dx) > Math.abs(dy)) go(dx < 0 ? 1 : -1);
    else if (Math.abs(dx) < 12 && Math.abs(dy) < 12) { pvImg.src = poster.src; pv.hidden = false; }
  });
  document.getElementById('pvX').addEventListener('click', function(){ pv.hidden = true; });
  function setMore(on){
    more.hidden = on;
    moreBody.hidden = !on;
    more.setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  more.addEventListener('click', function(){ setMore(true); });
  less.addEventListener('click', function(){ setMore(false); });
  heart.addEventListener('click', function(){
    var on = heart.getAttribute('aria-pressed') !== 'true';
    heart.setAttribute('aria-pressed', on ? 'true' : 'false');
    heart.setAttribute('aria-label', on ? '取消收藏' : '加入收藏');
  });
  document.getElementById('back').addEventListener('click', function(){
    if (history.length > 1) history.back();
    else location.assign('https://tangoweekend.org/');
  });
  var when = document.getElementById('when');
  var n = new Date();
  n.setDate(n.getDate() + ((2 - n.getDay() + 7) % 7));
  when.textContent = (n.getMonth() + 1) + '/' + n.getDate();
})();
</script>
</body>
</html>
