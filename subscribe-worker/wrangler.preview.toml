# Preview only. Do not deploy subscribe-worker/wrangler.toml from this file.
# No production route, no cron, no production D1 id.
# Mail is refused unless the recipient is shiao.li.chang@gmail.com (PREVIEW=1).
name = "tango-subscribe-preview"
main = "../social-worker/src/live.js"
compatibility_date = "2026-10-15"
workers_dev = true

[vars]
PREVIEW = "1"
TEST_ONLY_RECIPIENT = "shiao.li.chang@gmail.com"
SOCIAL_MAIL = "log"
MAIL_PROVIDER = "log"
ALLOW_NO_TURNSTILE = "1"
PREVIEW_SHOW_CODE = "1"
API_BASE = "https://tango-subscribe-preview.5mjqgtq8zh.workers.dev"
# Origins allowed for CORS, return URLs, and the finish-page map link. Ignored unless PREVIEW=1.
PREVIEW_ORIGINS = "https://tango-subscribe-preview.5mjqgtq8zh.workers.dev"

# Create with: npx wrangler d1 create tango-subscribe-preview
# Paste the returned database_id over the placeholder below. Both bindings
# must be that new database, never 1b462639-75a1-4dcf-9b15-eab807e4b295.
[[d1_databases]]
binding = "DB"
database_name = "tango-subscribe-preview"
database_id = "00000000-0000-0000-0000-000000000000"

[[d1_databases]]
binding = "SDB"
database_name = "tango-subscribe-preview"
database_id = "00000000-0000-0000-0000-000000000000"
