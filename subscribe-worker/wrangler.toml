# Live worker for api.tangoweekend.org. Deploy only with --keep-vars.
# main must stay the social entry. src/index.js alone drops /social/*.
# Do not put secret values in this file. Do not set GOING_STATS or GOING_NOTICE_SEND.
keep_vars = true
name = "tango-subscribe"
main = "../social-worker/src/live.js"
compatibility_date = "2026-10-15"
routes = [{ pattern = "api.tangoweekend.org", custom_domain = true }]

# Dashboard vars stay because keep_vars is true. Do not copy GMAIL_USER,
# NOTIFY_TO, WX_NOTIFY_TO, or TURNSTILE_SITEKEY into this file: production
# already has them, and a wrong value here would replace them if keep_vars
# were ignored. SOCIAL_MAIL is a plain var (currently resend), not a binding.
# GOING_STATS and GOING_NOTICE_SEND stay unset.
# GOING_TEST_INBOX stays unset. Do not assign it here. When set later to
# selecttango@gmail.com, and GOING_NOTICE_SEND is still not on, a non-test
# dancer's Going/Interested letter is copied only to that inbox.

# Both crons are already live. The 10-minute one runs the WeChat sweep.
# The 03:17 UTC one cleans unconfirmed subscribe rows. Do not drop either.
# Do not add the sample stats/notice cron from going.cron.example.toml.
[triggers]
crons = ["*/10 * * * *", "17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tango-subscribe"
database_id = "1b462639-75a1-4dcf-9b15-eab807e4b295"

# Same database as DB. Going tables live here. Do not create a second D1.
[[d1_databases]]
binding = "SDB"
database_name = "tango-subscribe"
database_id = "1b462639-75a1-4dcf-9b15-eab807e4b295"

# Destination-locked. Owner notices to that one address only. Not organizer mail.
[[send_email]]
name = "EMAIL"
destination_address = "selecttango@gmail.com"

# Allowed sender. Subscriber mail when MAIL_PROVIDER=cloudflare, and social
# mail when SOCIAL_MAIL is unset or sub_mail. Production SOCIAL_MAIL is resend,
# so this binding stays in place and is not the current social sender.
[[send_email]]
name = "SUB_MAIL"
allowed_sender_addresses = ["subscribe@tangoweekend.org"]

[ai]
binding = "AI"
