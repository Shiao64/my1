name = "tango-subscribe"
main = "src/index.js"
compatibility_date = "2026-10-15"
routes = [{ pattern = "api.tangoweekend.org", custom_domain = true }]

[vars]
SENDER = "subscribe@tangoweekend.org"
SENDER_NAME = "Asia Tango Map"
NOTIFY_TO = "selecttango@gmail.com,guazong@mail.grokbot.com"
API_BASE = "https://api.tangoweekend.org"
# Subscriber mail provider: 'gmail' (default; Gmail SMTP as GMAIL_USER via TCP sockets, From "Asia Tango Map <selecttango@gmail.com>").
#   REQUIRED at release time, before deploy:  npx wrangler secret put GMAIL_APP_PASSWORD   (16-char Google app password)
#   Gmail limit: ~500 recipients/day for a consumer account.
# Others: 'log' (print only), 'cloudflare' (Email Sending, Workers Paid), 'resend' (secret RESEND_API_KEY).
# TEST_ONLY_RECIPIENT (optional) limits sends to one address.
MAIL_PROVIDER = "gmail"
GMAIL_USER = "selecttango@gmail.com"

# Daily cleanup of pending (unconfirmed) rows older than 7 days.
[triggers]
crons = ["17 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "tango-subscribe"
database_id = "1b462639-75a1-4dcf-9b15-eab807e4b295"

[[send_email]]
name = "EMAIL"
destination_address = "selecttango@gmail.com"

# Subscriber mail via Cloudflare Email Sending (needs tangoweekend.org onboarded to Email Sending + Workers Paid).
# Only used when MAIL_PROVIDER = "cloudflare".
[[send_email]]
name = "SUB_MAIL"
allowed_sender_addresses = ["subscribe@tangoweekend.org"]
