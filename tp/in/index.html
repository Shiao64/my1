<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#4a0609">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>工作人员登入 · 探戈通</title>
<style>
:root{--red:#b3121b;--deep:#4a0609;--gold:#e8c06a;--cream:#fbf5e9;--ink:#2a1a14;--muted:#7a6255;--line:#ead9b8;--soft:#f6e3b4;--ok:#1f7a3a}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}
header{background:var(--deep);color:#fff;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
header b{display:block;font-size:1rem}header small{color:var(--gold);font-size:.8rem}
main{max-width:460px;margin:0 auto;padding:18px 16px 40px}
.hi{font-size:1.6rem;font-weight:800;margin:6px 0 6px;line-height:1.25}
.badge{display:inline-block;background:var(--soft);color:var(--deep);border:1px solid var(--gold);border-radius:999px;padding:2px 12px;font-size:.9rem;font-weight:700}
.badge.desk{background:#e6f0e8;border-color:#9cc5a6;color:#1f5a2e}
label{display:block;margin:20px 0 8px;color:var(--muted);font-size:.95rem}
.pin{width:100%;font-size:30px;letter-spacing:.6em;text-align:center;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff}
.pin:focus{outline:none;border-color:var(--deep)}
.btn{display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--deep);color:#fff;font-size:1.05rem;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.btn.sec{background:#fff;color:var(--deep);border:2px solid var(--deep)}
.btn:disabled{background:#cdbfa9}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:.95rem;line-height:1.5}
.msg.red{background:#fde8e8;color:#8a0f15;border:1px solid #f3b9b9}
.msg.ok{background:#e6f3ea;color:#1f5a2e;border:1px solid #a9d3b4}
.msg.warn{background:#fff3d6;color:#6b4a00;border:1px solid #ecd08a}
.note{margin-top:14px;font-size:.88rem;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b id="evName">探戈通</b><small>探戈通 · 工作人员登入</small></header>
<main>
  <div id="none" hidden>
    <div class="hi">请用你的专属链接</div>
    <p>打开上级发给你的链接，或用手机相机扫二维码，再输入六位密码。</p>
    <p class="note">管理员请到<a href="../admin/">管理页</a>用长密码登入。</p>
  </div>
  <div id="wechat" hidden>
    <div class="hi">请在浏览器打开</div>
    <p>链接没问题，但不要在微信里登入（微信关掉就会退出）。</p>
    <p>点右上角 <b>···</b> → 选「<b>在浏览器打开</b>」（iPhone 是 Safari）。</p>
    <p class="note">没有这个选项：按下面的按钮复制链接，贴到 Safari 或 Chrome。</p>
    <button class="btn sec" id="copy">复制链接</button><p class="note" id="copied" role="status"></p>
  </div>
  <div id="taken" hidden>
    <div class="hi" id="takenTitle"></div>
    <p id="takenText"></p>
    <button class="btn" id="swap" hidden></button>
    <a class="btn sec" id="stay" href="../admin/"></a>
  </div>
  <form id="form" hidden autocomplete="off">
    <div class="hi" id="hi"></div><span class="badge" id="role"></span>
    <div id="step1">
      <label for="pin">输入你的六位密码</label>
      <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="current-password">
    </div>
    <div id="step2" hidden>
      <p class="msg ok" style="margin-top:16px">临时密码正确。请设你自己的六位密码：只有你知道，别人（包括总管）看不到。</p>
      <label for="new1">新密码</label>
      <input class="pin" id="new1" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password">
      <label for="new2">再输一次</label>
      <input class="pin" id="new2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="new-password">
      <p class="note">不能是同一个数字、连号（123456）、重复（121212、123123、112233）、太常见的，也不能和临时密码一样。</p>
    </div>
    <p class="msg" id="msg" role="alert" hidden></p>
    <button class="btn" id="go" disabled>登入</button>
    <p class="note" id="help"></p>
  </form>
</main>
<script src="../tp.js?v=5"></script>
<script>
(function(){
var Q=new URLSearchParams(location.search);
var API=(function(){var a=Q.get('api');if(a&&/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(a))return a;return 'https://api.tangoweekend.org'})();
var $=function(i){return document.getElementById(i)},KEY=TP.keyFromUrl()||TP.key(),HELLO=null,temp='',busy=false;
var apiQ=Q.get('api')?'&api='+encodeURIComponent(Q.get('api')):'';
// platform step 3 (2026-11-25): the link names its event (?event=); the server answers with the role there, and after
// signing in the shared admin or check-in page opens on that event
var EV=TP.event();
function evQ(ev){ev=ev||(HELLO&&HELLO.event)||EV;return ev?'event='+encodeURIComponent(ev)+'&':''}
function hello(body){if(EV)body.event=EV;return post('/hello',body,TP.dev()||'')}
function post(p,body,tok){return fetch(API+'/social/reg/login'+p,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(tok||'')},body:JSON.stringify(body||{})})
  .then(function(r){return r.json().then(function(d){d._s=r.status;return d},function(){return {_s:r.status,error:'http'}})},function(){return {error:'network'}})}
function say(kind,text){var m=$('msg');m.className='msg '+kind;m.textContent=text;m.hidden=!text}
function home(d){var to=d.home==='checkin'?'../checkin/':'../admin/';location.replace(to+'?'+evQ(d.event)+'k='+KEY+apiQ+(d.home==='checkin'?'&new=1':''))}
function show(id){['none','wechat','taken','form'].forEach(function(x){$(x).hidden=x!==id})}
if(!KEY){show('none');return}
// The link in the 任命信 carries ?m=: opening it shows the 总管邮箱 works (2026-11-24). Sent at once, whichever screen
// follows, then taken out of the address bar. The phone's own sign-in goes along, to tell a new link of the same person.
var M=/^[0-9a-f]{32}$/.test(Q.get('m')||'')?Q.get('m'):'';
if(M)try{var U=new URL(location.href);U.searchParams.delete('m');history.replaceState(null,'',U.pathname+U.search+U.hash)}catch(e){}
var FIRST=hello(M?{key:KEY,m:M}:{key:KEY});
if(EV)[].forEach.call(document.querySelectorAll('a[href="../admin/"]'),function(a){a.href='../admin/?event='+encodeURIComponent(EV)+apiQ});
if(/MicroMessenger/i.test(navigator.userAgent)){show('wechat');
  $('copy').addEventListener('click',function(){var u=location.href;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){$('copied').textContent='已复制'},function(){$('copied').textContent='请长按网址手动复制'})});return}
// one phone, one identity
if(TP.owner()){show('taken');$('takenTitle').textContent='这台不能用这个链接';$('takenText').textContent='这台已经登入管理员。链接请给本人用自己的手机打开；自己想试，用另一支手机或无痕窗口。';$('stay').textContent='回管理页';return}
var me=TP.who();
function start(){
  var h=FIRST;FIRST=null;
  (h||hello({key:KEY})).then(function(d){
    if(d._s===404){if(KEY===TP.key())TP.out(true);show('none');$('none').querySelector('.hi').textContent='这个链接已经失效';$('none').querySelector('p').textContent='链接被重设，或人已被删除。请找发链接给你的人拿新的。';return}
    if(!d.ok){show('none');$('none').querySelector('.hi').textContent=d.error==='network'?'连不上后台':'暂时不能登入';$('none').querySelector('p').textContent=d.error==='network'?'请检查网络，再打开一次链接。':'请稍后再试。';return}
    HELLO=d;show('form');
    if(d.event_name){$('evName').textContent=d.event_name;document.title='工作人员登入 · '+d.event_name}
    $('hi').textContent='你好，'+d.name;$('role').textContent=TP.ROLE[d.role]||d.role;$('role').className='badge'+(d.role==='desk'?' desk':'');
    $('help').textContent='不是'+d.name+'？这个链接是给'+d.name+'的，请关掉，找发链接给你的人。忘了密码：请'+TP.up(d.role)+'按「重设」。';
    if(d.state==='locked'){say('warn','连错 5 次，已锁住。北京时间 '+TP.bjTime(d.until)+' 以后再试。');$('pin').disabled=true;return}
    if(d.state==='stopped'){say('red','连错 10 次，已停用。请找'+TP.up(d.role)+'按「重设」，拿新的链接和临时密码。');$('step1').hidden=true;$('go').hidden=true;return}
    if(d.state==='ended'){say('red','活动已经结束（北京时间 '+TP.bjDay(d.until)+'），这个账号已失效。');$('step1').hidden=true;$('go').hidden=true;return}
    if(d.state==='new')$('step1').querySelector('label').textContent='输入另外给你的六位临时密码';
    if(d.mail_ok)say('ok','邮箱已确认，谢谢。请输入密码登入。');
    setTimeout(function(){$('pin').focus()},50)});
}
function taken(){
  show('taken');$('takenTitle').textContent='这台现在是「'+me.name+'」的';
  $('takenText').textContent='一支手机一种身份。换成这个链接的人，「'+me.name+'」在这台就会退出。';
  $('swap').hidden=false;$('swap').textContent='换人：让「'+me.name+'」在这台退出';$('stay').textContent='不换，回去';$('stay').href=(me.role==='desk'?'../checkin/':'../admin/')+'?'+evQ()+'k='+TP.key()+apiQ;
  $('swap').addEventListener('click',function(){post('/out',{},TP.dev()).then(function(){TP.out(true);me=null;start()})});
}
if(TP.dev()&&me){
  FIRST.then(function(d){
    if(TP.key()===KEY){home({home:me.role==='desk'?'checkin':'admin'});return}   // already this person on this phone
    // a new link of the same person (重寄任命信 or 总管邮箱 changed): this phone stays in and keeps the new link
    if(d&&d.ok&&d.same){TP.signedIn({token:TP.dev(),name:d.name,role:d.role},KEY);home({home:d.role==='desk'?'checkin':'admin'});return}
    taken()});
}else start();
function digits(i){i.value=i.value.replace(/\D/g,'').slice(0,6)}
function ready(){
  if(!$('step2').hidden){$('go').disabled=busy||$('new1').value.length!==6||$('new2').value.length!==6;return}
  $('go').disabled=busy||$('pin').value.length!==6}
['pin','new1','new2'].forEach(function(i){$(i).addEventListener('input',function(){digits(this);say('','');ready();
  if(i==='pin'&&this.value.length===6&&!busy)submit()})});
$('form').addEventListener('submit',function(e){e.preventDefault();submit()});
function submit(){
  if(busy)return;var body={key:KEY};if(EV)body.event=EV;
  if($('step2').hidden){body.pin=$('pin').value;if(body.pin.length!==6)return}
  else{var a=$('new1').value,b=$('new2').value;if(a!==b){say('red','两次输入的不一样，请再输一次');$('new2').value='';ready();return}
    body.pin=temp;body.new_pin=a}
  busy=true;ready();say('','');
  post('',body).then(function(d){busy=false;ready();
    if(d.need_new){temp=body.pin;$('step1').hidden=true;$('step2').hidden=false;$('go').textContent='确定，进入'+(HELLO.role==='desk'?'签到页':HELLO.role==='manager'?'「现场」':'管理页');ready();setTimeout(function(){$('new1').focus()},50);return}
    if(d.ok&&d.token){TP.signedIn(d,KEY);home(d);return}
    if(d.error==='too_simple'){say('red','太简单，换一个：'+TP.weak(d.why)+'。');$('new1').value=$('new2').value='';ready();$('new1').focus();return}
    if(d.error==='wrong_pin'||d.error==='locked'||d.error==='stopped'){
      if(!$('step2').hidden){$('step2').hidden=true;$('step1').hidden=false;$('go').textContent='登入';temp=''}
      say(d.error==='locked'?'warn':'red',TP.pinText(d));$('pin').value='';ready();
      if(d.error==='wrong_pin')$('pin').focus();else{$('pin').disabled=true;if(d.error==='stopped')$('go').hidden=true}return}
    if(d.error==='ended'){say('red','活动已经结束，这个账号已失效。');return}
    if(d._s===404){say('red','这个链接已经失效：被重设或删除了。');return}
    say('red',d.error==='network'?'连不上后台，请检查网络再试。':'没登入成功（'+(d.error||d._s)+'），请再试一次。')});
}
})();
</script>
</body>
</html>
