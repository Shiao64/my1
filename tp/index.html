<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4a0609">
<title>平台管理 · 探戈通</title>
<!-- 平台管理页 (platform step 4, spec v0.6, 2026-11-25): the 管理员 only. Each event's seven steps and what is next,
     events made from an ATM card, 定案, 测试 → 正式 with its five checks, 北京 moving in. -->
<style>
:root{--deep:#4a0609;--red:#b3121b;--red-dark:#7a0a10;--gold:#e8c06a;--soft:#f6e3b4;--cream:#fbf5e9;--ink:#2a1a14;--muted:#7a6255;--line:#ead9b8;--ok:#1f7a3a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"PingFang SC",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff;max-width:100%}
button,.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;text-decoration:none;color:inherit;display:inline-block}
button.p,.btn.p{background:var(--red);border-color:var(--red);color:#fff}
button:disabled{opacity:.5;cursor:default}
header{background:var(--deep);color:var(--soft);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
header b{font-size:15px}
header .r{display:flex;gap:6px}
header button{background:transparent;color:var(--soft);border-color:#a66;padding:4px 10px}
main{max-width:1200px;margin:0 auto;padding:12px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:16px;color:var(--red-dark)}
h3{margin:14px 0 6px;font-size:14px}
.muted{color:var(--muted);font-size:13px}
#login{max-width:420px;margin:40px auto}
#login input{width:100%;margin:6px 0 10px;font-size:16px}
#login button{width:100%}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:4px 0 14px}
.k{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}
.k b{display:block;font-size:24px}
.k small{color:var(--muted)}
.k.hot{border-color:var(--red)}.k.hot b{color:var(--red)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#events{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:900px){#events{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}}
.ev{border-top:6px solid var(--ev,#4a0609);margin:0}
.evh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.evn{font-size:17px;overflow-wrap:anywhere}
.mode{flex:none;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;background:#eee}
.mode.test{background:#fff0bd;color:#7a5a00}.mode.practice{background:#ffe7a8;color:#6b4a00}.mode.live{background:#d9f2df;color:var(--ok)}
.nums{display:flex;flex-wrap:wrap;gap:4px 14px;margin:8px 0}
.nums b{font-size:16px}
.steps{display:flex;flex-wrap:wrap;gap:4px;list-style:none;padding:0;margin:8px 0 4px}
.steps li{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:13px;color:var(--muted)}
.steps li.ok{background:#e6f5ea;border-color:#b9e0c3;color:var(--ok)}
.steps li.now{border-color:var(--red);color:var(--red);font-weight:700}
.next{margin:4px 0 10px;color:var(--red-dark);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.set{border-top:1px dashed var(--line);margin-top:12px;padding-top:4px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;background:var(--ev)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.gate{list-style:none;padding:0;margin:6px 0}
.gate li{margin:2px 0}.gate .y{color:var(--ok)}.gate .x{color:var(--red)}
.why{background:#fff0bd;border-radius:8px;padding:6px 8px;font-size:13px;margin:6px 0}
#newForm label{display:block;margin:8px 0 2px;font-weight:700}
#newForm input,#newForm select,#newForm textarea{width:100%;font-size:16px}
#newForm .hint{margin:2px 0 0}
#msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a1a14;color:#fff;padding:10px 16px;border-radius:10px;max-width:92vw;display:none;z-index:50;white-space:pre-line}
</style>
</head>
<body>
<header><div><b>探戈通 · 平台管理</b></div>
  <div class="r" id="session" hidden><button id="refresh">刷新</button><button id="logout">退出</button></div></header>
<main>
  <form id="login" class="card" hidden>
    <h2>管理员登入</h2>
    <p class="muted">平台管理页只给管理员。</p>
    <label for="tok">长密码</label>
    <input id="tok" type="password" autocomplete="current-password">
    <button class="p" type="submit">登入</button>
  </form>
  <div class="card" id="notOwner" hidden>
    <h2>平台管理页只给管理员</h2>
    <p>这支手机登入的是「<b id="noName"></b>」。请回你自己的管理页。</p>
    <a class="btn p" id="toMine" href="admin/">回我的管理页</a>
  </div>
  <div id="app" hidden>
    <section class="cards" id="totals"></section>
    <div class="bar"><button class="p" id="newBtn">从 ATM 卡建立活动</button><span class="muted">报名表由 Claude 照资料代填（填写画面在第 2 阶段）。</span></div>
    <form class="card" id="newForm" hidden autocomplete="off">
      <h2>从 ATM 卡建立活动</h2>
      <label for="nCard">大型活动卡</label>
      <select id="nCard"><option value="">读取活动卡…</option></select>
      <p class="muted hint" id="nCardInfo"></p>
      <label for="nId">活动代号</label>
      <input id="nId" placeholder="例如 yearend2027" autocapitalize="off" spellcheck="false">
      <p class="muted hint">小写英文字母和数字，3 到 40 个字。管理页、签到页网址用它。</p>
      <label for="nSlug">网址代号</label>
      <input id="nSlug" placeholder="例如 yearend-2027" autocapitalize="off" spellcheck="false">
      <p class="muted hint">活动网页 tangoweekend.org/event/网址代号/。</p>
      <label for="nPrefix">报名编号前缀</label>
      <input id="nPrefix" placeholder="例如 YE27" autocapitalize="characters" spellcheck="false">
      <p class="muted hint">大写英文字母和数字，2 到 6 个字，例如报名编号 YE27-0001。</p>
      <label for="nShort">简称</label>
      <input id="nShort" placeholder="例如 跨年" maxlength="12">
      <p class="muted hint">给组织者的信，标题前面加上 [简称]。</p>
      <label for="nSign">信件署名</label>
      <textarea id="nSign" rows="2" placeholder="例如 刘峥&#10;Milonga V"></textarea>
      <div class="bar" style="margin-top:12px"><button class="p" type="submit" id="nGo">建立（测试模式，还没开放）</button><button type="button" id="nNo">取消</button></div>
    </form>
    <div id="events"></div>
  </div>
</main>
<div id="msg" role="status"></div>
<script src="tp.js?v=5"></script>
<script>
(function(){
var Q=new URLSearchParams(location.search);
var API=(function(){var a=Q.get('api');if(a&&/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(a))return a;return 'https://api.tangoweekend.org'})();
var apiQ=Q.get('api')?'&api='+encodeURIComponent(Q.get('api')):'';
var $=function(i){return document.getElementById(i)},TOKEN='',DATA=null,OPEN={},CARDS=null,CLEAR={};
var MODE={test:'测试',practice:'实习',live:'正式'},MARK='①②③④⑤⑥⑦';
var BIG=['festival','marathon','event','encuentro','weekend'];   // the ATM map's 大型活动
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(s,ms){var m=$('msg');m.textContent=s;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){m.style.display='none'},ms||5000)}
function fmt(n){return '¥'+Number(n||0).toLocaleString('en-US')}
function call(path,body){return fetch(API+path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:body?JSON.stringify(body):undefined})
  .then(function(r){return r.json().then(function(d){d._s=r.status;return d},function(){return {_s:r.status,error:'http'}})},function(){return {error:'network'}})}
function put(v){try{if(v)localStorage.setItem('bstw_admin',v);else localStorage.removeItem('bstw_admin')}catch(e){}}
function show(w){$('login').hidden=w!=='login';$('notOwner').hidden=w!=='notOwner';$('app').hidden=$('session').hidden=w!=='app'}
function load(){
  if(!TOKEN){show('login');return Promise.resolve()}
  $('refresh').disabled=true;
  return call('/social/admin/tp').then(function(d){$('refresh').disabled=false;
    if(d._s===401){put('');TOKEN='';show('login');toast('长密码不对或已失效');return}
    if(!d.ok){toast(d.error==='network'?'连不上后台，请检查网络':'读不到资料（'+(d.error||d._s)+'）');return}
    DATA=d;put(TOKEN);show('app');render()})}
function render(){
  var t=DATA.totals;
  $('totals').innerHTML=[k('待审核',t.pending,t.pending>0),k('逾期未付',t.overdue,t.overdue>0),k('寄信失败',t.mail_failed,t.mail_failed>0),k('今天寄出',DATA.today.mails,false,' 封报名相关的信')].join('');
  $('events').innerHTML=DATA.events.map(card).join('')||'<p class="muted">还没有活动。按「从 ATM 卡建立活动」。</p>'}
function k(label,n,hot,unit){return '<div class="k'+(hot?' hot':'')+'"><small>'+esc(label)+'</small><b>'+esc(n)+'</b>'+(unit?'<small>'+esc(unit)+'</small>':'')+'</div>'}
function card(e){
  var c=e.counts||{},now=(e.steps.filter(function(s){return !s.done&&s.n<7})[0]||{}).n;
  var nums=[['报名',c.total||0],['人',c.people||0],['待审核',c.pending||0],['逾期',e.overdue||0],['已付款',c.paid||0],['寄信失败',e.mail_failed||0]].map(function(x){return '<span><b>'+x[1]+'</b> '+x[0]+'</span>'}).join('');
  var steps='<ol class="steps" aria-label="七步进度">'+e.steps.map(function(s){return '<li class="'+(s.done?'ok':s.n===now?'now':'')+'"'+(s.text?' title="'+esc(s.text)+'"':'')+'>'+MARK[s.n-1]+(s.done?' ✓':'')+'</li>'}).join('')+'</ol>';
  var chief=e.chief?esc(e.chief.name)+(e.chief.verified?'（总管邮箱已验证）':e.chief.email?'（总管邮箱还没验证）':'（还没填总管邮箱）'):'还没任命';
  return '<article class="ev card" data-ev="'+esc(e.id)+'" style="--ev:'+esc(e.color)+'">'+
    '<div class="evh"><div><b class="evn">'+esc(e.name)+'</b><br><span class="muted">'+esc(TP.days(e))+(e.city?' · '+esc(e.city):'')+' · '+esc(e.id)+'</span></div><span class="mode '+esc(e.mode)+'">'+esc(MODE[e.mode]||e.mode)+'</span></div>'+
    '<p class="muted" style="margin:6px 0 0">总管：'+chief+'</p><div class="nums">'+nums+'</div>'+steps+
    (e.next?'<p class="next">'+esc(e.next)+'</p>':'')+
    '<div class="acts"><a class="btn p" href="admin/?event='+encodeURIComponent(e.id)+apiQ+'">进入管理页</a><button data-set="'+esc(e.id)+'" aria-expanded="'+!!OPEN[e.id]+'">'+(OPEN[e.id]?'收起设定':'设定')+'</button>'+
      (e.adoptable?'<button data-adopt="'+esc(e.id)+'">搬进平台</button>':'')+'</div>'+
    (OPEN[e.id]?settings(e):'')+'</article>'}
function settings(e){
  var f=e.form||{},r=f.rules||{},adm='admin/?event='+encodeURIComponent(e.id)+apiQ+'#set',h=[];
  h.push('<div class="set"><h3>基本</h3><dl class="kv"><dt>活动卡</dt><dd>'+esc(e.card||'—')+'</dd>'+
    '<dt>活动网页</dt><dd><a href="'+esc(e.page.url)+'" target="_blank" rel="noopener">/event/'+esc(e.slug)+'/</a> '+(e.page.live?'<span class="gate"><span class="y">已上线</span></span>':'<b style="color:var(--red)">还没上线</b>')+'</dd>'+
    '<dt>编号前缀</dt><dd>'+esc(e.prefix)+'</dd><dt>简称</dt><dd>'+esc(e.short)+'</dd><dt>颜色</dt><dd><span class="sw"></span> '+esc(e.color)+'</dd>'+
    '<dt>信件署名</dt><dd>'+(e.sign?esc(e.sign).replace(/\n/g,'<br>'):'<span class="muted">（用预设）</span>')+'</dd></dl>');
  if(e.in_platform&&e.card)h.push('<div class="bar" style="margin-top:8px"><button data-card="'+esc(e.id)+'">从活动卡更新名称和日期</button></div>');
  h.push('<h3>报名表</h3>');
  if(!(f.items||[]).length)h.push('<p class="muted">还没填场次和套餐（由 Claude 照资料代填）。</p>');
  else{
    h.push('<div class="scroll"><table><thead><tr><th>场次</th><th class="n">价格</th><th class="n">上限</th></tr></thead><tbody>'+f.items.map(function(x){return '<tr><td>'+esc(x.name)+' <span class="muted">'+esc(x.code)+'</span></td><td class="n">'+fmt(x.price)+'</td><td class="n">'+(x.cap||'—')+'</td></tr>'}).join('')+'</tbody></table></div>');
    h.push('<div class="scroll"><table><thead><tr><th>套餐</th><th class="n">价格</th><th>包含</th></tr></thead><tbody>'+(f.pkgs||[]).map(function(x){return '<tr><td>'+esc(x.name)+'</td><td class="n">'+fmt(x.price)+'</td><td>'+esc((x.covers||[]).join('、')||'—')+'</td></tr>'}).join('')+'</tbody></table></div>');
    h.push('<p class="muted">手续费 '+fmt(r.fee)+' · 付款期限 '+esc(r.payDays)+' 天 · 第 '+esc(r.remindDay)+' 天提醒 · 每份最多 '+esc(r.maxPeople)+' 人 · 住宿'+(r.hotel?'开':'关')+(r.earlyPrice?' · 早鸟 '+fmt(r.earlyPrice)+'（到 '+esc(String(r.earlyEnd||'').slice(0,10))+'）':'')+(r.friendPrice?' · 朋友价 '+fmt(r.friendPrice):'')+(r.codes?' · 朋友码 '+r.codes+' 个':'')+'</p>')}
  if(e.locked_at)h.push('<p class="gate"><span class="y">✓ 已定案（'+esc(TP.bjDay(e.locked_at))+'）：场次、价格、套餐不能再改。</span></p>');
  else if(!e.in_platform)h.push('<p class="gate"><span class="y">✓ 写在程序里（北京），搬进平台时算已定案。</span></p>');
  else{var why=!(f.items||[]).length?'报名表还没填':!e.page.live?'活动网页还没上线':'';
    h.push('<div class="bar"><button class="p" data-lock="'+esc(e.id)+'"'+(why?' disabled':'')+'>定案（锁定报名表）</button>'+(why?'<span class="muted">'+esc(why)+'</span>':'<span class="muted">定案以后谁都不能再改场次、价格、套餐。</span>')+'</div>')}
  h.push('<h3>收款码</h3><p>'+(e.qr.length?'已上传：'+esc(e.qr.join('、')):'<b style="color:var(--red)">还没上传</b>')+' · <a href="'+esc(adm)+'">到管理页上传</a></p>');
  h.push('<h3>模式</h3><p>现在是 <b>'+esc(MODE[e.mode]||e.mode)+'</b>'+(e.mode_from==='REG_LIVE'?'<span class="muted">（还跟着 Cloudflare 的 REG_LIVE；按「搬进平台」以后由这里管）</span>':'')+'</p>');
  h.push(practice(e));
  if(e.mode!=='live'&&e.mode!=='practice'){
    h.push('<p class="muted">切到正式要这五项都完成：</p><ul class="gate">'+e.gate.map(function(g){return '<li class="'+(g.ok?'y':'x')+'">'+(g.ok?'✓ ':'✗ ')+esc(g.text)+'</li>'}).join('')+'</ul>');
    h.push('<div class="bar"><button class="p" data-live="'+esc(e.id)+'"'+(e.can_live?'':' disabled')+'>切到正式</button><span class="muted">'+(e.in_platform?'正式以后不能切回测试。':'先按「搬进平台」。')+'</span></div>')}
  if(CLEAR[e.id])h.push(clearBox(e,CLEAR[e.id]));
  h.push('<h3>团队与邮箱</h3><p class="muted">总管、活动邮箱、活动专属邮箱、测试名单：<a href="'+esc(adm)+'">到这场管理页的「设置」</a>。</p></div>');
  return h.join('')}
// --- 实习 (platform step 5): 测试 → 实习 → 结束实习并清空 → 正式
function practice(e){var h=[];
  if(e.mode==='practice'&&e.practice){var p=e.practice;
    h.push('<div class="why"><b>实习中</b>：真的总管、经理、前台用平常的管理页和签到页练习；资料在实习结束后清空。</div>'+
      '<p>实习报名链接（只发给参加实习的人）：</p><div class="bar"><input readonly value="'+esc(p.link)+'" style="flex:1;min-width:0"><button data-copy="'+esc(p.link)+'">复制</button></div>'+
      '<p>已报 <b>'+p.count+'</b> / '+p.cap+' 笔 · 每人最多 '+p.mine+' 笔 · 编号带 P（'+esc(e.prefix)+'P-0001）</p>'+
      '<div class="bar"><label>全场上限 <input type="number" min="5" max="30" value="'+p.cap+'" id="cap-'+esc(e.id)+'" style="width:5em"></label><button data-cap="'+esc(e.id)+'">保存上限</button></div>'+
      '<div class="bar"><button class="p" data-clear="'+esc(e.id)+'">结束实习并清空</button><span class="muted">先列出会删什么，确认后才删。</span></div>');
    return h.join('')}
  if(e.mode==='live'||!e.in_platform)return '';
  h.push('<p class="muted">切到实习要先完成：</p><ul class="gate">'+(e.practice_gate||[]).map(function(g){return '<li class="'+(g.ok?'y':'x')+'">'+(g.ok?'✓ ':'✗ ')+esc(g.text)+'</li>'}).join('')+'</ul>');
  h.push('<div class="bar"><label>全场上限 <input type="number" min="5" max="30" value="10" id="cap-'+esc(e.id)+'" style="width:5em"></label><button class="p" data-practice="'+esc(e.id)+'"'+(e.can_practice?'':' disabled')+'>切到实习</button>'+(e.has_stage===false?'<span class="muted">资料库还没更新（迁移 0029）</span>':'')+'</div>');
  if(e.can_clear&&(e.marked||{}).test)h.push('<div class="bar"><button data-clear="'+esc(e.id)+'">清空测试资料（'+e.marked.test+' 笔）</button></div>');
  return h.join('')}
function clearBox(e,c){var k=c.counts||{},w=c.what==='practice'?'实习':'测试';
  return '<div class="card" style="margin-top:10px;border-color:var(--red)"><h3 style="margin-top:0">'+(c.what==='practice'?'结束实习并清空':'清空测试资料')+'：会删除</h3>'+
    '<p>'+k.regs+' 笔'+w+'报名（'+k.people+' 人）、'+k.payments+' 笔收款、'+k.checkins+' 次签到、'+k.records+' 条处理纪录、'+k.mails+' 条寄信纪录。删了不能恢复。</p>'+
    '<p class="muted">会留：活动设定、报名表、收款码、活动邮箱、团队帐号和登入的手机。'+(c.what==='practice'?'清空后回到测试，五项把关都完成就能切正式。':'')+'</p>'+
    '<h3>感谢信（中英文，每个邮箱一封；不寄的请勾掉）</h3>'+(c.thank.length?c.thank.map(function(x){return '<label style="display:block"><input type="checkbox" data-thank="'+esc(x.email)+'" checked> '+esc(x.email)+' <span class="muted">'+esc(x.codes.join('、'))+'</span></label>'}).join(''):'<p class="muted">没有要寄的。</p>')+
    (c.skipped.length?'<p class="muted">不寄（假地址）：'+esc(c.skipped.join('、'))+'</p>':'')+
    '<div class="bar" style="margin-top:8px"><button class="p" data-clear-go="'+esc(e.id)+'">确认清空</button><button data-clear-no="'+esc(e.id)+'">取消</button></div></div>'}
// --- actions
$('events').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.set){OPEN[b.dataset.set]=!OPEN[b.dataset.set];render();return}
  if(b.dataset.copy){var t=b.dataset.copy;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){toast('已复制实习报名链接')},function(){toast('没复制成功，请长按手动复制')});return}
  if(b.dataset.clearNo){CLEAR[b.dataset.clearNo]=null;render();return}
  var pid=b.dataset.practice||b.dataset.cap||b.dataset.clear||b.dataset.clearGo,pe=pid&&DATA.events.filter(function(x){return x.id===pid})[0];
  if(pe){var cap=+(($('cap-'+pid)||{}).value||10);
    if(b.dataset.practice){if(!confirm('把「'+pe.name+'」切到实习？\n\n系统产生实习报名链接（全场最多 '+cap+' 笔，每人最多 5 笔），并把实习计划寄给总管邮箱、副本邮箱和管理员。实习报名不付款；实习完要按「结束实习并清空」，才能切正式。'))return;
      return act(b,'/mode',{event:pid,mode:'practice',cap:cap},'已切到实习')}
    if(b.dataset.cap)return act(b,'/practice',{event:pid,cap:cap},'已改上限：'+cap+' 笔');
    if(b.dataset.clear){b.disabled=true;return call('/social/admin/tp/clear',{event:pid}).then(function(d){b.disabled=false;if(!d.ok)return toast(errText(d),9000);CLEAR[pid]=d;OPEN[pid]=true;render()})}
    if(b.dataset.clearGo){var c=CLEAR[pid],thank=[].map.call(document.querySelectorAll('[data-ev="'+pid+'"] [data-thank]:checked'),function(i){return i.dataset.thank});
      if(!confirm('确定清空「'+pe.name+'」的'+(c.what==='practice'?'实习':'测试')+'资料？\n\n删除 '+c.counts.regs+' 笔报名和它们的收款、签到、纪录，不能恢复；寄 '+thank.length+' 封感谢信。'))return;
      b.disabled=true;return call('/social/admin/tp/clear',{event:pid,confirm:true,thank:thank}).then(function(d){b.disabled=false;
        if(!d.ok)return toast(errText(d),9000);CLEAR[pid]=null;toast('已清空：'+d.cleared.regs+' 笔报名；寄了 '+d.thanked+' 封感谢信'+(d.failed?'，'+d.failed+' 封没寄出':''),9000);load()})}}
  var id=b.dataset.adopt||b.dataset.lock||b.dataset.live||b.dataset.card,e=DATA.events.filter(function(x){return x.id===id})[0];if(!e)return;
  if(b.dataset.adopt){
    if(!confirm('把「'+e.name+'」搬进平台？\n\n照现在的状态建一笔资料：模式＝现在的'+(MODE[e.mode]||e.mode)+'，报名表算已定案，1225 实测算作实习已清空。之后这场的模式由平台管，不再看 Cloudflare 的 REG_LIVE。报名和信件照旧。'))return;
    return act(b,'/adopt',{event:id},'已搬进平台')}
  if(b.dataset.lock){
    if(!confirm('「'+e.name+'」报名表定案？\n\n定案以后，谁都不能再改场次、价格、套餐（已报名的金额和信里的数字要对得上）。'))return;
    return act(b,'/lock',{event:id},'已定案')}
  if(b.dataset.live){
    if(!confirm('「'+e.name+'」切到正式？\n\n所有信直接寄给本人，不再加 [测试]，测试名单不再起作用。正式以后不能切回测试。'))return;
    return act(b,'/mode',{event:id,mode:'live'},'已切到正式')}
  if(b.dataset.card){b.disabled=true;
    cards().then(function(list){var c=(list||[]).filter(function(x){return x.id===e.card})[0];
      if(!c){b.disabled=false;toast('找不到活动卡 '+e.card);return}
      var f=facts(c);
      if(f.name.zh===e.name&&f.starts===e.starts&&f.ends===e.ends){b.disabled=false;toast('活动卡上的名称和日期没有变');return}
      if(!confirm('照活动卡 '+c.id+' 更新？\n\n名称：'+f.name.zh+'\n日期：'+TP.days(f)+(f.starts!==e.starts||f.ends!==e.ends?'\n\n日期改了：会检查在这场任职的人，和他们其他活动不能重叠。':''))){b.disabled=false;return}
      act(b,'/card',Object.assign({event:id},f),'已照活动卡更新')})}});
function act(b,path,body,done){b.disabled=true;
  return call('/social/admin/tp'+path,body).then(function(d){b.disabled=false;
    if(d.ok){toast(done);return load()}
    toast(errText(d),9000);if(d.error==='changed')load()})}
function errText(d){var e=d.error;
  if(e==='network')return '连不上后台：不确定有没有成功，请先刷新看看';
  if(e==='not_ready'&&d.gate)return '还不能切，还差：'+d.gate.filter(function(g){return !g.ok}).map(function(g){return g.text}).join('、');
  if(e==='not_ready')return '资料库还没更新，暂时不能用';
  if(e==='practising')return '实习中：先「结束实习并清空」，才能切正式';
  if(e==='live')return '正式期间不能切实习、也不能清空';
  if(e==='not_practising')return '现在不是实习';
  if(e==='bad_field'&&d.which==='cap')return '实习上限要 5 到 30 笔';
  if(e==='same_time_people')return '没有更新：日期改了以后，这些人会同时在两场活动任职：\n'+d.people.map(function(p){return '「'+p.name+'」'+(p.error==='no_dates'?'：「'+p.event_name+'」没有日期':'也在「'+p.event_name+'」（'+TP.days(p)+'）')}).join('\n');
  if(e==='taken')return '没有建立：这个'+({id:'活动代号',slug:'网址代号',prefix:'编号前缀',card:'活动卡'}[d.which]||'')+'已经有活动用了';
  if(e==='bad_field')return '没有建立：'+({id:'活动代号要 3 到 40 个小写英文字母或数字',slug:'网址代号只能用小写英文字母、数字和 -',prefix:'编号前缀要 2 到 6 个大写英文字母或数字',card:'请选一张活动卡',name:'活动卡没有名称',dates:'活动卡没有日期'}[d.which]||d.which);
  if(e==='no_form')return '还不能定案：报名表还没填';
  if(e==='no_page')return '还不能定案：活动网页还没上线';
  if(e==='locked')return '已经定案了';
  if(e==='already')return '已经在平台上了';
  if(e==='changed')return '别人刚改过，画面已换成最新的';
  return '没成功：'+(e||d._s)}
// --- 从 ATM 卡建立
function facts(c){return {name:{zh:c.name_zh||c.name,en:c.name||c.name_zh},starts:c.start,ends:c.end||c.start,city:c.city||''}}
function cards(){if(CARDS)return Promise.resolve(CARDS);
  return fetch('/asia/events.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){CARDS=(Array.isArray(d)?d:d.events||[]);return CARDS}).catch(function(){return null})}
$('newBtn').addEventListener('click',function(){var f=$('newForm');f.hidden=!f.hidden;if(f.hidden)return;
  cards().then(function(list){
    if(!list){$('nCard').innerHTML='<option value="">读不到活动卡</option>';return}
    var used={},today=new Date(Date.now()+288e5).toISOString().slice(0,10);DATA.events.forEach(function(x){if(x.card)used[x.card]=1});
    var big=list.filter(function(c){return c&&c.id&&BIG.indexOf(c.type)>=0&&!c.hidden&&!used[c.id]&&c.start&&(c.end||c.start)>=today})
      .sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:0});
    $('nCard').innerHTML='<option value="">选一张大型活动卡（'+big.length+' 张）</option>'+big.map(function(c){return '<option value="'+esc(c.id)+'">'+esc((c.name_zh||c.name)+' · '+TP.days({starts:c.start,ends:c.end})+' · '+(c.city||'')+' · '+c.id)+'</option>'}).join('');
  });f.scrollIntoView({block:'start'})});
$('nNo').addEventListener('click',function(){$('newForm').hidden=true});
$('nCard').addEventListener('change',function(){var c=(CARDS||[]).filter(function(x){return x.id===$('nCard').value})[0];
  $('nCardInfo').textContent=c?(c.name||'')+(c.name_zh?' / '+c.name_zh:'')+' · '+c.start+(c.end&&c.end!==c.start?' → '+c.end:'')+' · '+[c.city,c.country].filter(Boolean).join(', '):'';
  if(c&&!$('nShort').value)$('nShort').value=String(c.name_zh||c.city||'').slice(0,12);
  var m=c&&/^\/event\/([a-z0-9-]+)\/?$/.exec(c.detail||'');if(m)$('nSlug').value=m[1]});   // a card that has its 活动网页 already: that address
$('newForm').addEventListener('submit',function(ev){ev.preventDefault();
  var c=(CARDS||[]).filter(function(x){return x.id===$('nCard').value})[0];if(!c)return toast('请选一张活动卡');
  var body=Object.assign({card:c.id,id:$('nId').value.trim().toLowerCase(),slug:$('nSlug').value.trim().toLowerCase(),prefix:$('nPrefix').value.trim().toUpperCase(),short:$('nShort').value.trim(),sign:$('nSign').value.trim()},facts(c));
  if(!confirm('从活动卡 '+c.id+' 建立「'+body.name.zh+'」？\n\n活动代号 '+body.id+'，网址 /event/'+body.slug+'/，编号 '+body.prefix+'-0001。\n建好是测试模式，还没开放报名。'))return;
  var b=$('nGo');b.disabled=true;
  call('/social/admin/tp/events',body).then(function(d){b.disabled=false;
    if(!d.ok)return toast(errText(d),9000);
    ['nId','nSlug','nPrefix','nShort','nSign'].forEach(function(i){$(i).value=''});$('newForm').hidden=true;OPEN[d.id]=true;CARDS=null;
    toast('已建立「'+body.name.zh+'」：测试模式，还没开放');load()})});
// --- sign-in: the long password only; a team member's phone is told where to go
$('login').addEventListener('submit',function(ev){ev.preventDefault();
  if(TP.dev()){toast('这台已经是「'+((TP.who()||{}).name||'')+'」的：一支手机一种身份');return}
  TOKEN=$('tok').value.trim();$('tok').value='';load()});
$('refresh').addEventListener('click',load);
$('logout').addEventListener('click',function(){if(!confirm('退出管理员？再进来要输长密码。'))return;put('');TOKEN='';DATA=null;show('login')});
TOKEN=TP.owner();
if(!TOKEN&&TP.dev()){$('noName').textContent=(TP.who()||{}).name||'';$('toMine').href=((TP.who()||{}).role==='desk'?'checkin/':'admin/')+(apiQ?'?'+apiQ.slice(1):'');show('notOwner')}
else load();
})();
</script>
</body>
