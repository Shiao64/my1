  <div class="dj-story">
    <div class="dj-photo" id="pf-photo"></div>
    <p class="dj-bio" id="pf-bio">刘峥，2006 年开始跳探戈，中国第一代探戈人。2007 年创办「探戈会（VTango）」，长期在北京组织探戈课程、舞会与外教 Workshop。2013 年与许暄宜共同成立「中国阿根廷探戈协会」，发起世界探戈锦标赛中国区赛。先后创办 Tango Holiday（2014）、北京探戈公开赛（2017）和北京兔爷探戈节（2019）。他也是资深探戈 DJ，以黄金年代传统为本，均衡分配舞会能量。2018 年获阿根廷驻华大使馆表彰。</p>
